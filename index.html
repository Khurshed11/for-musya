<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=0.5, maximum-scale=1.0, user-scalable=yes">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Our Story</title>
	
    <link type="text/css" rel="stylesheet" href="./index_files/default.css">
    <script type="text/javascript" src="./index_files/jquery.min.js"></script>
    <script type="text/javascript" src="./index_files/jscex.min.js"></script>
    <script type="text/javascript" src="./index_files/jscex-parser.js"></script>
    <script type="text/javascript" src="./index_files/jscex-jit.js"></script>
    <script type="text/javascript" src="./index_files/jscex-builderbase.min.js"></script>
    <script type="text/javascript" src="./index_files/jscex-async.min.js"></script>
    <script type="text/javascript" src="./index_files/jscex-async-powerpack.min.js"></script>
    <script type="text/javascript" src="./index_files/functions.js" charset="utf-8"></script>
    <script type="text/javascript" src="./index_files/love.js" charset="utf-8"></script>
    <script type="text/javascript" src="./config.js"></script>
	
    <style type="text/css">
        .STYLE1 {
            color: #666666
        }
		#main {
            zoom: 0.42;
            -moz-transform: scale(0.42);
            -moz-transform-origin: top center;
        }
        body {
            overflow-x: hidden;
        }

        /* Стили для интерактивного конверта-сердечка */
        #love-letter-box {
            display: none;
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 999;
        }
        .heart-envelope {
            width: 80px;
            height: 80px;
            background: #ff4d4d;
            position: relative;
            transform: rotate(45deg);
            margin: 0 auto 20px auto;
            cursor: pointer;
            animation: heartbeat 1.2s infinite;
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.6);
        }
        .heart-envelope:before,
        .heart-envelope:after {
            content: '';
            width: 80px;
            height: 80px;
            background: #ff4d4d;
            border-radius: 50%;
            position: absolute;
        }
        .heart-envelope:before { top: -40px; left: 0; }
        .heart-envelope:after { left: -40px; top: 0; }

        .envelope-text {
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            z-index: 1000;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }

        @keyframes heartbeat {
            0% { transform: rotate(45deg) scale(1); }
            15% { transform: rotate(45deg) scale(1.15); }
            30% { transform: rotate(45deg) scale(1); }
            45% { transform: rotate(45deg) scale(1.1); }
            60% { transform: rotate(45deg) scale(1); }
        }

        /* Само всплывающее окно письма с фото */
        #modal-letter {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        .letter-content {
            background: #fff;
            padding: 25px;
            border-radius: 15px;
            max-width: 90%;
            width: 320px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            font-family: sans-serif;
            max-height: 85vh;
            overflow-y: auto;
        }
        .letter-photos {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .letter-photos img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .close-letter {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<img src="https://ajlovechina.github.io/loveBalloon/static/music.png"
     style="position: fixed; z-index: 10001; top: 10px; right: 10px;"
     onclick="let m = document.querySelector('.song-audio-autoplay'); if (m.paused ) {m.play(); this.className = 'rotateImages';} else {m.pause(); this.className = ''}">
    <audio class="song-audio-autoplay" controls loop style="display: none;visibility: hidden">
        <source src="./index_files/music2.mp3" type="audio/mp3" />
    </audio>
    <style type="text/css">
        .rotateImages {
            -webkit-animation: myRotate 10s linear infinite;
            animation: myRotate 10s linear infinite;
        }

        @-webkit-keyframes myRotate {
            0% { -webkit-transform: rotate(0deg); }
            50% { -webkit-transform: rotate(180deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes myRotate {
            0% { -webkit-transform: rotate(0deg); }
            50% { -webkit-transform: rotate(180deg); }
            100% { -webkit-transform: rotate(360deg); }
        }
    </style>

    <div id="main">
        <div id="error">本页面采用HTML5编辑，目前您的浏览器无法显示，请换成谷歌(<a
                href="http://www.google.cn/chrome/intl/zh-CN/landing_chrome.html?hl=zh-CN&brand=CHMI">Chrome</a>)或者火狐(<a
                href="http://firefox.com.cn/download/">Firefox</a>)浏览器，或者其他游览器的最新版本。
        </div>
        <div id="wrap">
            <div id="text">
                <div id="code">
                </div>
            </div>
            <div id="clock-box">
                <span id="clock-box-inside-text">
                </span>
                <div id="clock"></div>
            </div>
            <canvas id="canvas" width="1100" height="680"></canvas>
        </div>
    </div>

    <!-- Интерактивное сердечко-конверт в конце -->
    <div id="love-letter-box">
        <div class="heart-envelope" onclick="openLetter()">
            <div class="envelope-text">Письмо ❤️</div>
        </div>
    </div>

    <!-- Модальное окно с письмом и фотками -->
    <div id="modal-letter">
        <div class="letter-content">
            <h3 style="color: #ff4d4d; margin-bottom: 15px;">Моей любимой Мусе</h3>
            <div class="letter-photos">
                <!-- Замени photo1.jpg и photo2.jpg на названия своих фото из папки index_files -->
                <img src="./index_files/photo1.jpg" alt="Photo">
                <img src="./index_files/photo2.jpg" alt="Photo">
            </div>
            <p style="font-size: 13px; color: #555; line-height: 1.5; margin-bottom: 15px;">
                Каждый момент, проведенный с тобой — это бесценное сокровище. Спасибо, что ты есть у меня! 💖
            </p>
            <button class="close-letter" onclick="closeLetter()">Закрыть</button>
        </div>
    </div>

    <script type="text/javascript">
        $('#code').html(config.lines.map(item => {
            return `<span class="say">${item}</span><br>
						<span class="say"> </span><br>`
        }).reduce((a, b) => {
            return a + b;
        }))
        $("#clock-box-inside-text").html(`${config.names[0]} и ${config.names[1]} <span class="STYLE1">вместе уже:</span>`)
    </script>

    <script>
            (function () {
                var canvas = $('#canvas');

                if (!canvas[0].getContext) {
                    $("#error").show();
                    return false;
                }

                var width = canvas.width();
                var height = canvas.height();

                canvas.attr("width", width);
                canvas.attr("height", height);

                var opts = {
                    seed: {
                        x: width / 2 - 20,
                        color: "rgb(190, 26, 37)",
                        scale: 2
                    },
                    branch: [
                        [535, 680, 570, 250, 500, 200, 30, 100, [
                            [540, 500, 455, 417, 340, 400, 13, 100, [
                                [450, 435, 434, 430, 394, 395, 2, 40]
                            ]],
                            [550, 445, 600, 356, 680, 345, 12, 100, [
                                [578, 400, 648, 409, 661, 426, 3, 80]
                            ]],
                            [539, 281, 537, 248, 534, 217, 3, 40],
                            [546, 397, 413, 247, 328, 244, 9, 80, [
                                [427, 286, 383, 253, 371, 205, 2, 40],
                                [498, 345, 435, 315, 395, 330, 4, 60]
                            ]],
                            [546, 357, 608, 252, 678, 221, 6, 100, [
                                [590, 293, 646, 277, 648, 271, 2, 80]
                            ]]
                        ]]
                    ],
                    bloom: {
                        num: 700,
                        width: 1080,
                        height: 650,
                    },
                    footer: {
                        width: 1200,
                        height: 5,
                        speed: 10,
                    }
                }

                var tree = new Tree(canvas[0], width, height, opts);
                var seed = tree.seed;
                var foot = tree.footer;
                var hold = 1;

                canvas.click(function (e) {
                    var offset = canvas.offset(), x, y;
                    x = e.pageX - offset.left;
                    y = e.pageY - offset.top;
                    if (seed.hover(x, y)) {
                        hold = 0;
                        canvas.unbind("click");
                        canvas.unbind("mousemove");
                        canvas.removeClass('hand');
                    }
                }).mousemove(function (e) {
                    var offset = canvas.offset(), x, y;
                    x = e.pageX - offset.left;
                    y = e.pageY - offset.top;
                    canvas.toggleClass('hand', seed.hover(x, y));
                });

                var seedAnimate = eval(Jscex.compile("async", function () {
                    seed.draw();
                    while (hold) {
                        $await(Jscex.Async.sleep(10));
                    }
                    while (seed.canScale()) {
                        seed.scale(0.95);
                        $await(Jscex.Async.sleep(10));
                    }
                    while (seed.canMove()) {
                        seed.move(0, 2);
                        foot.draw();
                        $await(Jscex.Async.sleep(10));
                    }
                }));

                var growAnimate = eval(Jscex.compile("async", function () {
                    do {
                        tree.grow();
                        $await(Jscex.Async.sleep(10));
                    } while (tree.canGrow());
                }));

                var flowAnimate = eval(Jscex.compile("async", function () {
                    do {
                        tree.flower(2);
                        $await(Jscex.Async.sleep(10));
                    } while (tree.canFlower());
                }));

                var moveAnimate = eval(Jscex.compile("async", function () {
                    tree.snapshot("p1", 240, 0, 610, 680);
                    while (tree.move("p1", 500, 0)) {
                        foot.draw();
                        $await(Jscex.Async.sleep(10));
                    }
                    foot.draw();
                    tree.snapshot("p2", 500, 0, 610, 680);

                    canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
                    canvas.css("background", "#ffe");
                    $await(Jscex.Async.sleep(300));
                    canvas.css("background", "none");
                }));

                var jumpAnimate = eval(Jscex.compile("async", function () {
                    var ctx = tree.ctx;
                    while (true) {
                        tree.ctx.clearRect(0, 0, width, height);
                        tree.jump();
                        foot.draw();
                        $await(Jscex.Async.sleep(25));
                    }
                }));

                var textAnimate = eval(Jscex.compile("async", function () {
                    var together = new Date(config.date);

                    $("#code").show().typewriter();
                    $("#clock-box").fadeIn(500);
                    
                    // Показываем сердечко-письмо после того, как текст начал печататься
                    document.getElementById('love-letter-box').style.display = 'block';

                    while (true) {
                        timeElapse(together);
                        $await(Jscex.Async.sleep(1000));
                    }
                }));

                var runAsync = eval(Jscex.compile("async", function () {
                    $await(seedAnimate());$await(growAnimate());
                    $await(flowAnimate());$await(moveAnimate());

                    textAnimate().start();

                    $await(jumpAnimate());
                }));

                runAsync().start();
            })();
    </script>

    <script>
      document.addEventListener('click', function() {
        let m = document.querySelector('.song-audio-autoplay');
        if (m && m.paused) {
          m.play();
        }
      }, { once: true });

      function openLetter() {
        document.getElementById('modal-letter').style.display = 'flex';
      }
      function closeLetter() {
        document.getElementById('modal-letter').style.display = 'none';
      }
    </script>
</body>

</html>
